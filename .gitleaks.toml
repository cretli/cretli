title = "Cretli gitleaks config"

[extend]
useDefault = true

# Tests and docs contain deliberately fake credentials so the key-handling code
# can be exercised without a real account. Without this allowlist every pull
# request would fail the secret scan on known-good fixtures.
[[allowlists]]
description = "Test fixtures and documented example values"
paths = [
  '''^tests/''',
  '''^scripts/README\.md$''',
  '''^\.env\.example$''',
  '''^\.cretli-sdk\.env\.example$''',
]
regexes = [
  '''sk-or-v1-abc123456789''',
  '''sk-zoyvdtest1234567890''',
  '''ghp_test_token''',
  '''crsr_(env_fixture|explicit)''',
  '''chat-e2e-pass-123''',
]
