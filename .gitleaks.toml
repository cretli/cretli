title = "Cretli gitleaks config"

[extend]
useDefault = true

# Tests and docs contain deliberately fake credentials so the key-handling code
# can be exercised without a real account. Without this allowlist every pull
# request would fail the secret scan on known-good fixtures.
# Global allowlist in Gitleaks 8.24.3 is a single [allowlist] table. Its path
# and regex checks are ORed, so these fixture paths and known dummy values are
# independently ignored.
[allowlist]
paths = [
  '''(^|/)tests/''',
  '''(^|/)scripts/README\.md$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)\.cretli-sdk\.env\.example$''',
  # Design notes: todo idempotency keys and prose that the generic-api-key rule
  # mistakes for credentials (no secrets live in these files).
  '''(^|/)docs/cretli-next-steps\.todo\.json$''',
  '''(^|/)docs/settings-backup-design\.md$''',
]
regexes = [
  '''sk-or-v1-abc123456789''',
  '''sk-zoyvdtest1234567890''',
  '''zai\.test\.key\.1234567890''',
  '''zai\.coding\.key\.abcdef''',
  '''ghp_test_token''',
  '''crsr_(env_fixture|explicit)''',
  '''chat-e2e-pass-123''',
]
