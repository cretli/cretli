<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<script>try{var t=localStorage.getItem('cretli-docs-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/docs.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu</button>
  <a class="brand" href="index.html">Cretli docs</a>
  <input class="search" type="search" placeholder="Search docs" aria-label="Search docs" hidden>
  <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme">Theme</button>
</header>
<div class="layout">
  <nav id="site-nav" class="site-nav" aria-label="Documentation">
    <ul class="search-results" hidden></ul>
{{nav}}
  </nav>
  <main id="content">
    <article>
{{content}}
    </article>
{{prevNext}}
  </main>
  <aside class="toc" aria-label="On this page">
{{toc}}
  </aside>
</div>
<footer class="site-footer">Cretli documentation</footer>
<script src="assets/docs.js" defer></script>
</body>
</html>
