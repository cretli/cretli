<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e1e" />
    <script>
    (function () {
      var preference = 'cretli-dark', cache = {};
      try {
        preference = localStorage.getItem('cretli-theme') || localStorage.getItem('cursor-remote-theme') || preference;
        cache = JSON.parse(localStorage.getItem('cretli-theme-cache') || '{}') || {};
      } catch (error) {}
      if (preference === 'dark' || preference === 'light') preference = 'cretli-' + preference;
      var appearance = preference === 'cretli-light' ? 'light' : 'dark';
      if (preference === 'system') {
        try { appearance = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (error) {}
      } else {
        ['dark', 'light'].forEach(function (key) {
          if (cache[key] && cache[key].themeId === preference) appearance = key;
        });
      }
      var entry = cache[appearance];
      var expected = preference;
      if (preference === 'system') {
        try { expected = localStorage.getItem('cretli-theme-' + appearance) || 'cretli-' + appearance; } catch (error) {}
        if (expected === 'dark' || expected === 'light') expected = 'cretli-' + expected;
        // Runtime rejects a system selection with a different appearance.
        if (entry && entry.themeId === 'cretli-' + appearance) expected = entry.themeId;
      }
      if (!entry || entry.themeId !== expected) entry = null;
      var css = '';
      if (entry && typeof entry.css === 'string') {
        var match = entry.css.match(/^:root:root:root\{([^{}]*)\}$/);
        if (match && match[1].split(';').every(function (declaration) {
          return /^--cr-[a-z0-9-]+:(#[\da-f]{3,4}|#[\da-f]{6}|#[\da-f]{8}|(?:rgb|hsl)a?\(\s*[\d.%+\-, /]+\))$/i.test(declaration);
        })) css = entry.css;
      }
      var root = document.documentElement;
      root.dataset.theme = appearance;
      root.dataset.themeId = entry ? entry.themeId : 'cretli-' + appearance;
      root.style.colorScheme = appearance;
      var style = document.createElement('style');
      style.id = 'cr-theme-vars';
      style.textContent = css;
      document.head.appendChild(style);
      var color = entry && /^(#[\da-f]{3,4}|#[\da-f]{6}|#[\da-f]{8}|(?:rgb|hsl)a?\(\s*[\d.%+\-, /]+\))$/i.test(entry.themeColor) ? entry.themeColor : (appearance === 'light' ? '#f3f3f3' : '#1e1e1e');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = color;
      function applyBodyTheme() {
        if (!document.body) return false;
        document.body.classList.toggle('theme-light', appearance === 'light');
        return true;
      }
      if (!applyBodyTheme()) document.addEventListener('DOMContentLoaded', applyBodyTheme, { once: true });
    })();
  </script>
    <title>Cretli — sign in</title>
    <meta name="application-name" content="Cretli" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || '');
        var next = params.get('next') || '';
        var widgetAuth = params.get('widgetAuth') === '1' || next.indexOf('/widget-authorize/') !== -1;
        window.__crWidgetAuth = widgetAuth;
        if (!widgetAuth) return;
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('link[rel="manifest"]').forEach(function (link) {
            link.remove();
          });
        }, { once: true });
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cretli" />
    <!-- No vendor.css here: it is only the icon font and xterm styles, which the
         login page does not use. Its own tokens live in login.css. -->
    <link rel="stylesheet" href="/dist/app/login.css?v=__CR_ASSET_VERSION__" />
  </head>
  <body>
    <div id="login-root"></div>
    <script>
      // PWA: register the service worker (offline login shell), but not during widget auth in iframe.
      if ('serviceWorker' in navigator && !window.__crWidgetAuth) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
    <script src="/dist/app/vendor-login.bundle.js?v=__CR_ASSET_VERSION__"></script>
    <script src="/dist/app/login.bundle.js?v=__CR_ASSET_VERSION__"></script>
  </body>
</html>
