<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e1e" />
    <script>
      (function () {
        var preference = 'dark';
        try {
          var savedPreference =
          localStorage.getItem('cretli-theme') || localStorage.getItem('cursor-remote-theme');
          if (savedPreference === 'light' || savedPreference === 'system') {
            preference = savedPreference;
          }
        } catch (error) {}

        var useLight = preference === 'light';
        if (preference === 'system') {
          try {
            useLight =
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: light)').matches;
          } catch (error) {}
        }

        var theme = useLight ? 'light' : 'dark';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = useLight ? '#f3f3f3' : '#1e1e1e';

        function applyBodyTheme() {
          if (!document.body) return false;
          document.body.classList.toggle('theme-light', useLight);
          return true;
        }

        if (!applyBodyTheme()) {
          document.addEventListener('DOMContentLoaded', applyBodyTheme, { once: true });
        }
      })();
    </script>
    <title>Cretli — offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #1e1e1e;
        color: #d4d4d4;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box;
      }
      .wrap { max-width: 480px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #f2f2f2; }
      p { margin: 0 0 20px; color: #a8a8a8; }
      button {
        background: #3b82f6; color: #fff; border: 0; border-radius: 8px;
        padding: 10px 18px; font-size: 15px; cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      .icon { color: #3b82f6; margin-bottom: 12px; }
      html[data-theme="light"] body, body.theme-light {
        background: #f3f3f3;
        color: #242424;
      }
      html[data-theme="light"] h1, body.theme-light h1 { color: #1f1f1f; }
      html[data-theme="light"] p, body.theme-light p { color: #5f5f5f; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 512 512" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
          <path d="M120 176 L192 256 L120 336" />
          <path d="M232 360 L392 360" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>The Cretli server isn't reachable right now. The app shell is cached — reconnect to your server to continue.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      if ('onLine' in navigator) {
        window.addEventListener('online', () => location.reload());
      }
    </script>
  </body>
</html>
