name: CI

on:
  push:
    branches: [main, master, 'next/**']
  pull_request:
    branches: [main, master]

# Required status checks (set in the repository branch protection, this file cannot
# enforce it): `CI / core`, `CI / optional` and `CI / test-without-cursor-sdk`. Neither
# job may use continue-on-error. Renaming `test` to `core` means the old `CI / test` required
# check must be replaced by `CI / core` and `CI / optional`.
#
# core:     lint, typecheck, tests/*.test.js with CRETLI_OPTIONAL_HARNESSES set to an empty
#           string (no optional harness plugin loads at boot) and the production build.
#           A core test that exercises a plugin loads the default plugin set itself through
#           tests/helpers/default-optional-harnesses.js, so it stays in this job.
# optional: harnesses/<id>/tests/*.test.js with the default plugin set (variable unset).
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.18 <23'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Lint
        run: npm run lint
      # Fails when any file has more type errors than docs/typecheck-baseline.json.
      - name: Typecheck (ratchet)
        run: npm run typecheck
      # tests/browser-live.test.js runs only when detectBrowserRuntime() finds a
      # Chromium binary. Install at the DEFAULT cache path (~/.cache/ms-playwright),
      # no PLAYWRIGHT_BROWSERS_PATH override, so the plain `npm test` step below
      # resolves playwright.chromium.executablePath() to this same install. Use the
      # playwright-core CLI (the runtime dependency), NOT the `playwright` CLI:
      # @playwright/test pins 1.62.1, whose installer fetches a Chromium revision
      # that playwright-core 1.63.0 never looks for, and the test would keep
      # silently skipping on a green CI.
      - name: Install Chromium for the live browser test
        run: npx playwright-core install --with-deps chromium
      - name: Run core tests (no optional plugins)
        env:
          # Core boots without any optional harness plugin.
          CRETLI_OPTIONAL_HARNESSES: ""
          # Turn the graceful "browser-unavailable" skip into a hard failure: CI
          # must never go green while this test skipped. Local runs leave it unset.
          CRETLI_REQUIRE_BROWSER_LIVE: "1"
        run: npm run test:core
      - name: Build frontend (prod)
        run: npm run prod -w cretli-front

  optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.18 <23'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run optional plugin tests (default plugin set)
        run: npm run test:plugins

  test-without-cursor-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.18 <23'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Remove optional Cursor SDK
        run: npm uninstall @cursor/sdk --no-save
      - name: Run tests that must pass without @cursor/sdk
        run: npm run test:without-cursor-sdk
