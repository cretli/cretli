name: Good first issue
description: Small, well-scoped task for a new contributor
title: "[Good first issue] "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should the contributor do? Point at files.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - docs
        - i18n
        - docker / install
        - ui polish
        - tests
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How a reviewer will know this is complete.
