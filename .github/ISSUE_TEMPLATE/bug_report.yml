name: Bug report
description: Something is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the problem
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Chat harness
      description: Which agent backend were you using?
      options:
        - none / not a chat issue
        - opencode
        - openrouter
        - sdk
        - unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Cretli version, Node, OS/browser, bind mode (localhost/LAN). Redact secrets.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server logs or browser console. Redact secrets.
